<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no,
      viewport-fit=cover">

<title>English phrases</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Arial, sans-serif;
    background: #f6f7f9;
    color: #202124;

    padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
}

.app {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

/* ================= HEADER ================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 750;
}

.header p {
    margin: 6px 0 0;
    color: #6b7078;
    font-size: 15px;
}

.total-counter {
    margin-top: 8px;
    color: #6b7078;
    font-size: 14px;
}

/* ================= DIRECTION ================= */

.direction-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.direction-btn {
    border: 1px solid #d8dbe2;
    background: white;
    color: #30343a;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
}

.direction-btn.active {
    background: #202124;
    color: white;
    border-color: #202124;
}

/* ================= EMPTY ================= */

.empty-state {
    background: white;
    border: 1px solid #e0e2e6;
    border-radius: 18px;
    padding: 42px 20px;
    text-align: center;
}

.empty-state h2 {
    margin: 0 0 8px;
    font-size: 22px;
}

.empty-state p {
    margin: 0 0 22px;
    color: #70757d;
}

/* ================= BUTTON ================= */

.add-main-btn {
    width: 100%;
    border: none;
    background: #202124;
    color: white;
    border-radius: 13px;
    min-height: 52px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 650;
    cursor: pointer;
    touch-action: manipulation;
}

.add-main-btn:active {
    transform: scale(0.98);
}

/* ================= ADD MOBILE ================= */

.add-mobile {
    margin-top: 16px;
    background: white;
    border: 1px solid #e0e2e6;
    border-radius: 16px;
    padding: 16px;
}

.add-mobile h3 {
    margin: 0 0 10px;
    font-size: 17px;
}

.add-mobile textarea,
.section-content textarea {
    display: block;
    width: 100%;
    height: 130px;
    min-height: 130px;
    max-height: 300px;

    resize: none;

    -webkit-appearance: none;
    appearance: none;

    border: 1px solid #d8dbe2;
    border-radius: 10px;

    padding: 13px;

    outline: none;

    font-family: inherit;
    font-size: 16px;
    line-height: 1.4;

    background: #fff;
    color: #202124;

    box-shadow: none;

    overflow-y: auto;

    -webkit-user-select: text;
    user-select: text;
}

.add-mobile textarea:focus,
.section-content textarea:focus {
    border-color: #9aa0a6;
}

/* ================= STUDY ================= */

.study-area {
    display: none;
}

.flashcard {
    width: 100%;
    min-height: 310px;

    background: white;

    border: 1px solid #e0e2e6;
    border-radius: 20px;

    padding: 28px 22px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.card-label {
    color: #8a9098;
    font-size: 13px;
    margin-bottom: 18px;
    font-weight: 650;

    text-transform: uppercase;
    letter-spacing: .04em;
}

.card-text {
    text-align: center;

    font-size: clamp(25px, 4vw, 40px);
    line-height: 1.25;

    font-weight: 700;

    max-width: 900px;

    word-break: break-word;
}

.card-hint {
    margin-top: 18px;
    color: #8a9098;
    font-size: 13px;
}

.speak-btn {
    margin-top: 22px;

    width: 44px;
    height: 44px;

    border: 1px solid #d8dbe2;
    background: white;

    border-radius: 50%;

    cursor: pointer;

    font-size: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;
}

.speak-btn:active {
    transform: scale(.94);
}

/* ================= NAVIGATION ================= */

.navigation {
    width: 100%;

    margin: 14px auto 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 0;
}

.nav-btn {
    width: 54px;
    height: 48px;

    padding: 0;

    border: 1px solid #d8dbe2;
    background: white;

    border-radius: 13px;

    font-size: 25px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;

    flex-shrink: 0;
}

.nav-btn:active {
    transform: scale(0.96);
}

.page-counter {
    width: 54px;

    text-align: center;

    color: #4d5156;

    font-size: 15px;
    font-weight: 650;

    flex-shrink: 0;
}

/* ================= ANSWERS ================= */

.answer-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 14px;
}

.answer-btn {
    min-height: 52px;

    border-radius: 13px;

    border: 1px solid #d8dbe2;
    background: white;

    font-size: 15px;
    font-weight: 650;

    cursor: pointer;

    touch-action: manipulation;
}

.answer-btn:active {
    transform: scale(.98);
}

.answer-btn.unknown {
    color: #b3261e;
}

.answer-btn.known {
    color: #137333;
}

/* ================= PROGRESS ================= */

.progress-wrap {
    margin-top: 15px;
}

.progress-info {
    display: flex;
    justify-content: space-between;

    color: #777d85;

    font-size: 13px;

    margin-bottom: 7px;
}

.progress-bar {
    width: 100%;
    height: 7px;

    background: #e2e4e8;

    border-radius: 20px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;

    background: #202124;

    border-radius: inherit;

    transition: width .2s ease;
}

/* ================= DETAILS ================= */

details {
    margin-top: 14px;

    background: white;

    border: 1px solid #e0e2e6;

    border-radius: 14px;

    overflow: hidden;
}

summary {
    cursor: pointer;

    padding: 15px 16px;

    font-size: 15px;
    font-weight: 650;

    user-select: none;
    -webkit-user-select: none;
}

.section-content {
    padding: 0 16px 16px;
}

.section-content textarea {
    margin-bottom: 10px;
}

.section-btn {
    width: 100%;

    min-height: 46px;

    border: 1px solid #d8dbe2;
    background: #f8f9fa;

    border-radius: 10px;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    touch-action: manipulation;
}

/* ================= DELETE ================= */

.delete-all-btn {
    width: 100%;

    min-height: 46px;

    margin-top: 14px;

    border: 1px solid #e5bcbc;

    background: #fff5f5;

    color: #b3261e;

    border-radius: 10px;

    font-size: 15px;
    font-weight: 650;

    cursor: pointer;

    touch-action: manipulation;
}

.delete-all-btn:active {
    transform: scale(.98);
}

/* ================= VOICE ================= */

.voice-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 12px;
}

.voice-row:last-child {
    margin-bottom: 0;
}

.voice-row label {
    font-size: 14px;
}

.voice-row select {
    border: 1px solid #d8dbe2;

    background: white;

    border-radius: 9px;

    padding: 8px 10px;

    font-size: 14px;
}

/* ================= CARD LIST ================= */

.card-list {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.card-list-item {
    border: 1px solid #e0e2e6;

    border-radius: 10px;

    padding: 11px 12px;

    background: #fafbfc;

    cursor: pointer;
}

.card-list-item:active {
    transform: scale(.99);
}

.card-list-en {
    font-weight: 650;
    margin-bottom: 4px;
}

.card-list-ru {
    color: #70757d;
    font-size: 14px;
}

/* ================= DESKTOP ================= */

@media (min-width: 700px) {

    .flashcard {
        min-height: 350px;
    }

    .answer-buttons {
        max-width: 650px;

        margin-left: auto;
        margin-right: auto;
    }

    .progress-wrap {
        max-width: 650px;

        margin-left: auto;
        margin-right: auto;
    }

    details {
        max-width: 850px;

        margin-left: auto;
        margin-right: auto;
    }

    .add-mobile {
        max-width: 850px;

        margin-left: auto;
        margin-right: auto;
    }
}

/* ================= MOBILE ================= */

@media (max-width: 699px) {

    body {
        padding:
            max(12px, env(safe-area-inset-top))
            max(10px, env(safe-area-inset-right))
            max(14px, env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
    }

    .header {
        margin-bottom: 15px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 14px;
    }

    .direction-buttons {
        gap: 6px;

        margin-bottom: 13px;
    }

    .direction-btn {
        padding: 8px 11px;

        font-size: 13px;
    }

    .flashcard {
        min-height: 290px;

        padding: 24px 16px;

        border-radius: 17px;
    }

    .card-text {
        font-size: clamp(24px, 7vw, 34px);
    }

    .navigation {
        margin-top: 12px;

        gap: 0;
    }

    .nav-btn {
        width: 50px;
        height: 46px;

        border-radius: 12px;

        font-size: 23px;
    }

    .page-counter {
        width: 50px;

        font-size: 14px;
    }

    .answer-buttons {
        margin-top: 12px;

        gap: 8px;
    }

    .answer-btn {
        min-height: 50px;

        font-size: 14px;
    }
}

/* ================= SMALL PHONES ================= */

@media (max-width: 390px) {

    .flashcard {
        min-height: 270px;
    }

    .card-text {
        font-size: 23px;
    }

    .nav-btn {
        width: 46px;
        height: 44px;
    }

    .page-counter {
        width: 46px;

        font-size: 13px;
    }

    .add-mobile textarea,
    .section-content textarea {
        font-size: 16px;

        height: 130px;
        min-height: 130px;
        max-height: 300px;
    }
}

/* ================= LANDSCAPE MOBILE ================= */

@media (max-width: 900px) and (orientation: landscape) {

    body {
        overflow-x: hidden;
    }

    .flashcard {
        min-height: 240px;
    }

    .add-mobile textarea,
    .section-content textarea {
        font-size: 16px;
    }

    details {
        max-height: 320px;

        overflow: hidden;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            English phrases
        </h1>

        <p>
            Карточки для изучения английского
        </p>

        <div
            class="total-counter"
            id="totalCounter">
            0 карточек
        </div>

    </div>


    <!-- ================= DIRECTION ================= -->

    <div class="direction-buttons">

        <button
            class="direction-btn active"
            id="directionEnRu"
            onclick="setDirection('en-ru')">

            English → Русский

        </button>

        <button
            class="direction-btn"
            id="directionRuEn"
            onclick="setDirection('ru-en')">

            Русский → English

        </button>

        <button
            class="direction-btn"
            id="directionMixed"
            onclick="setDirection('mixed')">

            Mixed

        </button>

    </div>


    <!-- ================= EMPTY STATE ================= -->

    <div
        class="empty-state"
        id="emptyState">

        <h2>
            Пока нет карточек
        </h2>

        <p>
            Добавь английские фразы и их перевод,
            чтобы начать учить.
        </p>

        <button
            class="add-main-btn"
            onclick="showAddPanel()">

            ＋ Добавить карточки

        </button>

    </div>


    <!-- ================= FIRST ADD PANEL ================= -->

    <div
        class="add-mobile"
        id="addCardsMobile"
        style="display:none;">

        <h3>
            Добавить карточки
        </h3>

        <textarea
            id="cardInput"
            placeholder="How did you pull that off? — Как тебе удалось это сделать?
I can't believe it. — Я не могу в это поверить."></textarea>

        <button
            class="add-main-btn"
            style="margin-top:10px;"
            onclick="addCards()">

            Добавить

        </button>

    </div>


    <!-- ================= STUDY AREA ================= -->

    <div
        class="study-area"
        id="studyArea">


        <!-- ================= FLASHCARD ================= -->

        <div
            class="flashcard"
            id="flashcard"
            onclick="flipCard()">

            <div
                class="card-label"
                id="cardLabel">

                English

            </div>

            <div
                class="card-text"
                id="cardText">

                —

            </div>

            <div
                class="card-hint"
                id="cardHint">

                Нажми на карточку, чтобы перевернуть

            </div>

            <button
                class="speak-btn"
                onclick="speakCurrent(event)"
                aria-label="Озвучить">

                🔊

            </button>

        </div>


        <!-- ================= NAVIGATION ================= -->

        <div class="navigation">

            <button
                class="nav-btn"
                onclick="previousCard()"
                aria-label="Предыдущая">

                ←

            </button>

            <div
                class="page-counter"
                id="pageCounter">

                1 / 0

            </div>

            <button
                class="nav-btn"
                onclick="nextCard()"
                aria-label="Следующая">

                →

            </button>

        </div>


        <!-- ================= ANSWER BUTTONS ================= -->

        <div class="answer-buttons">

            <button
                class="answer-btn unknown"
                onclick="markUnknown()">

                ✕ Не знаю

            </button>

            <button
                class="answer-btn known"
                onclick="markKnown()">

                ✓ Знаю

            </button>

        </div>


        <!-- ================= PROGRESS ================= -->

        <div class="progress-wrap">

            <div class="progress-info">

                <span>
                    Прогресс
                </span>

                <span id="progressText">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

        </div>


        <!-- ================= VOICE SETTINGS ================= -->

        <details>

            <summary>
                🔊 Настройки озвучки
            </summary>

            <div class="section-content">

                <div class="voice-row">

                    <label for="voiceLanguage">
                        Язык:
                    </label>

                    <select id="voiceLanguage">

                        <option value="en-US">
                            English US
                        </option>

                        <option value="en-GB">
                            English UK
                        </option>

                    </select>

                </div>


                <div class="voice-row">

                    <label for="speechRate">
                        Скорость:
                    </label>

                    <select id="speechRate">

                        <option value="0.6">
                            0.6×
                        </option>

                        <option value="0.8">
                            0.8×
                        </option>

                        <option value="1">
                            1×
                        </option>

                        <option value="1.2">
                            1.2×
                        </option>

                    </select>

                </div>

            </div>

        </details>


        <!-- ================= ADD MORE ================= -->

        <details>

            <summary>
                ＋ Добавить карточки
            </summary>

            <div class="section-content">

                <textarea
                    id="cardInputStudy"
                    placeholder="English — Русский"></textarea>

                <button
                    class="section-btn"
                    onclick="addCardsFromStudy()">

                    Добавить карточки

                </button>

            </div>

        </details>


        <!-- ================= ALL CARDS ================= -->

        <details>

            <summary>
                📚 Все карточки
            </summary>

            <div class="section-content">

                <div
                    class="card-list"
                    id="cardList">
                </div>


                <!-- DELETE ALL -->

                <button
                    class="delete-all-btn"
                    onclick="deleteAllCards()">

                    🗑️ Удалить все карточки

                </button>

            </div>

        </details>

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let cards = JSON.parse(
    localStorage.getItem("englishCards") || "[]"
);

let knownCards = JSON.parse(
    localStorage.getItem("knownCards") || "[]"
);

let unknownCards = JSON.parse(
    localStorage.getItem("unknownCards") || "[]"
);

let direction =
    localStorage.getItem("cardDirection") || "en-ru";

let speechRate =
    Number(
        localStorage.getItem("speechRate") || "1"
    );

let voiceLanguage =
    localStorage.getItem("voiceLanguage") || "en-US";

let currentIndex = 0;

let isFlipped = false;


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document.getElementById(
            "speechRate"
        ).value = speechRate;


        document.getElementById(
            "voiceLanguage"
        ).value = voiceLanguage;


        document
            .getElementById("speechRate")
            .addEventListener(
                "change",
                function () {

                    speechRate =
                        Number(this.value);

                    localStorage.setItem(
                        "speechRate",
                        speechRate
                    );

                }
            );


        document
            .getElementById("voiceLanguage")
            .addEventListener(
                "change",
                function () {

                    voiceLanguage =
                        this.value;

                    localStorage.setItem(
                        "voiceLanguage",
                        voiceLanguage
                    );

                }
            );


        updateDirectionButtons();


        if (cards.length > 0) {

            document
                .getElementById("emptyState")
                .style.display = "none";


            document
                .getElementById("addCardsMobile")
                .style.display = "none";


            document
                .getElementById("studyArea")
                .style.display = "block";


            showCard();

            renderList();

        } else {

            updateCounters();

        }

    }
);


/* =========================================================
   DIRECTION
========================================================= */

function setDirection(value) {

    direction = value;

    localStorage.setItem(
        "cardDirection",
        direction
    );

    currentIndex = 0;

    isFlipped = false;

    updateDirectionButtons();

    if (cards.length > 0) {
        showCard();
    }

}


function updateDirectionButtons() {

    document
        .getElementById("directionEnRu")
        .classList.toggle(
            "active",
            direction === "en-ru"
        );


    document
        .getElementById("directionRuEn")
        .classList.toggle(
            "active",
            direction === "ru-en"
        );


    document
        .getElementById("directionMixed")
        .classList.toggle(
            "active",
            direction === "mixed"
        );

}


/* =========================================================
   SHOW ADD PANEL
========================================================= */

function showAddPanel() {

    const panel =
        document.getElementById(
            "addCardsMobile"
        );

    panel.style.display = "block";


    setTimeout(
        () => {

            document
                .getElementById("cardInput")
                .focus();

        },
        100
    );

}


/* =========================================================
   PARSE + ADD
========================================================= */

function parseAndAddCards(text) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line => line.trim()
            )
            .filter(Boolean);


    let added = 0;


    lines.forEach(
        line => {

            const parts =
                line.split(
                    /\s*[—–-]\s*/
                );


            if (parts.length < 2) {
                return;
            }


            const english =
                parts[0].trim();


            const russian =
                parts
                    .slice(1)
                    .join(" - ")
                    .trim();


            if (
                !english ||
                !russian
            ) {
                return;
            }


            cards.push({

                id:
                    Date.now() +
                    Math.random(),

                en: english,

                ru: russian

            });


            added++;

        }
    );


    return added;

}


/* =========================================================
   ADD FIRST CARDS
========================================================= */

function addCards() {

    const input =
        document.getElementById(
            "cardInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        alert(
            "Введи хотя бы одну карточку."
        );

        return;
    }


    const added =
        parseAndAddCards(text);


    if (added === 0) {

        alert(
            "Не удалось добавить карточки.\n\n" +
            "Формат:\n" +
            "English — Русский"
        );

        return;
    }


    input.value = "";


    saveCards();


    document
        .getElementById("emptyState")
        .style.display = "none";


    document
        .getElementById("addCardsMobile")
        .style.display = "none";


    document
        .getElementById("studyArea")
        .style.display = "block";


    currentIndex =
        Math.max(
            0,
            cards.length - added
        );


    isFlipped = false;


    showCard();

    renderList();

}


/* =========================================================
   ADD FROM STUDY
========================================================= */

function addCardsFromStudy() {

    const input =
        document.getElementById(
            "cardInputStudy"
        );


    const text =
        input.value.trim();


    if (!text) {

        alert(
            "Введи хотя бы одну карточку."
        );

        return;
    }


    const added =
        parseAndAddCards(text);


    if (added === 0) {

        alert(
            "Не удалось добавить карточки.\n\n" +
            "Формат:\n" +
            "English — Русский"
        );

        return;
    }


    input.value = "";


    saveCards();


    showCard();

    renderList();


    const details =
        input.closest("details");


    if (details) {
        details.open = false;
    }

}


/* =========================================================
   SAVE
========================================================= */

function saveCards() {

    localStorage.setItem(
        "englishCards",
        JSON.stringify(cards)
    );


    localStorage.setItem(
        "knownCards",
        JSON.stringify(knownCards)
    );


    localStorage.setItem(
        "unknownCards",
        JSON.stringify(unknownCards)
    );


    updateCounters();

}


/* =========================================================
   SHOW CARD
========================================================= */

function showCard() {

    if (cards.length === 0) {
        return;
    }


    if (currentIndex < 0) {
        currentIndex = 0;
    }


    if (
        currentIndex >= cards.length
    ) {

        currentIndex =
            cards.length - 1;

    }


    isFlipped = false;


    const card =
        cards[currentIndex];


    let showEnglish = true;


    if (direction === "ru-en") {

        showEnglish = false;

    }


    else if (
        direction === "mixed"
    ) {

        showEnglish =
            Math.random() > 0.5;

    }


    const cardText =
        document.getElementById(
            "cardText"
        );


    const cardLabel =
        document.getElementById(
            "cardLabel"
        );


    const cardHint =
        document.getElementById(
            "cardHint"
        );


    if (showEnglish) {

        cardText.textContent =
            card.en;

        cardLabel.textContent =
            "English";

    } else {

        cardText.textContent =
            card.ru;

        cardLabel.textContent =
            "Русский";

    }


    cardHint.textContent =
        "Нажми на карточку, чтобы перевернуть";


    cardText.dataset.side =
        showEnglish
            ? "en"
            : "ru";


    document
        .getElementById("pageCounter")
        .textContent =
        `${currentIndex + 1} / ${cards.length}`;


    updateProgress();

}


/* =========================================================
   FLIP
========================================================= */

function flipCard() {

    if (cards.length === 0) {
        return;
    }


    const card =
        cards[currentIndex];


    const cardText =
        document.getElementById(
            "cardText"
        );


    const cardLabel =
        document.getElementById(
            "cardLabel"
        );


    const currentSide =
        cardText.dataset.side;


    if (currentSide === "en") {

        cardText.textContent =
            card.ru;

        cardLabel.textContent =
            "Русский";

        cardText.dataset.side =
            "ru";

    } else {

        cardText.textContent =
            card.en;

        cardLabel.textContent =
            "English";

        cardText.dataset.side =
            "en";

    }


    isFlipped =
        !isFlipped;

}


/* =========================================================
   NAVIGATION
========================================================= */

function nextCard() {

    if (cards.length === 0) {
        return;
    }


    currentIndex++;


    if (
        currentIndex >= cards.length
    ) {

        currentIndex = 0;

    }


    showCard();

}


function previousCard() {

    if (cards.length === 0) {
        return;
    }


    currentIndex--;


    if (currentIndex < 0) {

        currentIndex =
            cards.length - 1;

    }


    showCard();

}


/* =========================================================
   KNOWN / UNKNOWN
========================================================= */

function markKnown() {

    if (cards.length === 0) {
        return;
    }


    const id =
        cards[currentIndex].id;


    if (
        !knownCards.includes(id)
    ) {

        knownCards.push(id);

    }


    unknownCards =
        unknownCards.filter(
            item => item !== id
        );


    saveCards();


    nextCard();

}


function markUnknown() {

    if (cards.length === 0) {
        return;
    }


    const id =
        cards[currentIndex].id;


    if (
        !unknownCards.includes(id)
    ) {

        unknownCards.push(id);

    }


    knownCards =
        knownCards.filter(
            item => item !== id
        );


    saveCards();


    nextCard();

}


/* =========================================================
   DELETE ALL CARDS
========================================================= */

function deleteAllCards() {

    if (cards.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            `Удалить все ${cards.length} карточек?\n\n` +
            `Прогресс обучения также будет сброшен.\n\n` +
            `Это действие нельзя отменить.`
        );


    if (!confirmed) {
        return;
    }


    cards = [];

    knownCards = [];

    unknownCards = [];


    currentIndex = 0;

    isFlipped = false;


    localStorage.removeItem(
        "englishCards"
    );

    localStorage.removeItem(
        "knownCards"
    );

    localStorage.removeItem(
        "unknownCards"
    );


    document
        .getElementById("studyArea")
        .style.display = "none";


    document
        .getElementById("emptyState")
        .style.display = "block";


    document
        .getElementById("addCardsMobile")
        .style.display = "none";


    updateCounters();

    updateProgress();

    renderList();

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    if (cards.length === 0) {

        document
            .getElementById("progressText")
            .textContent = "0%";


        document
            .getElementById("progressFill")
            .style.width = "0%";


        return;
    }


    const knownCount =
        knownCards.filter(
            id =>
                cards.some(
                    card =>
                        card.id === id
                )
        ).length;


    const percent =
        Math.round(
            (knownCount / cards.length) *
            100
        );


    document
        .getElementById("progressText")
        .textContent =
        `${percent}%`;


    document
        .getElementById("progressFill")
        .style.width =
        `${percent}%`;

}


/* =========================================================
   COUNTERS
========================================================= */

function updateCounters() {

    const total =
        cards.length;


    const counter =
        document.getElementById(
            "totalCounter"
        );


    if (total === 0) {

        counter.textContent =
            "0 карточек";

        return;
    }


    if (total === 1) {

        counter.textContent =
            "1 карточка";

    }

    else if (
        total >= 2 &&
        total <= 4
    ) {

        counter.textContent =
            `${total} карточки`;

    }

    else {

        counter.textContent =
            `${total} карточек`;

    }

}


/* =========================================================
   CARD LIST
========================================================= */

function renderList() {

    const list =
        document.getElementById(
            "cardList"
        );


    list.innerHTML = "";


    cards.forEach(
        (card, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "card-list-item";


            item.innerHTML = `

                <div class="card-list-en">
                    ${escapeHtml(card.en)}
                </div>

                <div class="card-list-ru">
                    ${escapeHtml(card.ru)}
                </div>

            `;


            item.onclick = () => {

                currentIndex = index;

                showCard();


                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            };


            list.appendChild(item);

        }
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   SPEECH
========================================================= */

function speakCurrent(event) {

    if (event) {
        event.stopPropagation();
    }


    if (cards.length === 0) {
        return;
    }


    const card =
        cards[currentIndex];


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Озвучка не поддерживается этим браузером."
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            card.en
        );


    utterance.lang =
        voiceLanguage;


    utterance.rate =
        speechRate;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (cards.length === 0) {
            return;
        }


        if (
            event.target.tagName ===
                "TEXTAREA" ||

            event.target.tagName ===
                "INPUT" ||

            event.target.tagName ===
                "SELECT"
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextCard();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousCard();

        }


        if (
            event.key === " " ||
            event.key === "Enter"
        ) {

            event.preventDefault();

            flipCard();

        }

    }
);


/* =========================================================
   SWIPE MOBILE
========================================================= */

let touchStartX = 0;

let touchEndX = 0;


const flashcard =
    document.getElementById(
        "flashcard"
    );


flashcard.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive: true
    }
);


flashcard.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0]
                .screenX;


        const diff =
            touchEndX -
            touchStartX;


        if (
            Math.abs(diff) < 50
        ) {

            return;

        }


        if (diff < 0) {

            nextCard();

        } else {

            previousCard();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   START
========================================================= */

updateCounters();

</script>
