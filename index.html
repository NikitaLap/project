<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>English Phrases</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f5f6f8;
    color: #202124;

    overflow-x: hidden;
}

button,
textarea {
    font-family: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}


/* =========================
   MAIN
========================= */

.container {
    width: 100%;
    max-width: 700px;

    margin: 0 auto;

    padding:
        20px
        14px
        40px;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

h1 {
    margin: 0;

    font-size: 25px;
    line-height: 1.1;
}

.subtitle {
    margin-top: 5px;

    color: #777;
    font-size: 12px;
}

.counter {
    flex-shrink: 0;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 8px 10px;

    font-size: 12px;
    font-weight: 600;
}


/* =========================
   DIRECTION
========================= */

.top-controls {
    display: flex;

    gap: 7px;

    width: 100%;

    overflow-x: auto;

    padding-bottom: 4px;

    margin-bottom: 12px;

    scrollbar-width: none;
}

.top-controls::-webkit-scrollbar {
    display: none;
}

.direction-btn {
    flex: 0 0 auto;

    min-height: 40px;

    padding: 8px 12px;

    border-radius: 10px;

    border: 1px solid #d5d8de;

    background: white;

    color: #202124;

    font-size: 12px;
    font-weight: 600;

    white-space: nowrap;
}

.direction-btn.active {
    background: #202124;
    color: white;
}


/* =========================
   STUDY
========================= */

#studyArea {
    width: 100%;
}

#emptyState {
    width: 100%;

    margin-top: 20px;

    padding: 45px 20px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 16px;

    text-align: center;

    color: #777;

    line-height: 1.5;
}

#emptyState strong {
    display: block;

    color: #202124;

    font-size: 20px;

    margin-bottom: 8px;
}


/* =========================
   CARD
========================= */

.card-wrapper {
    width: 100%;
}

.flashcard {
    width: 100%;

    height: 390px;

    position: relative;

    perspective: 1200px;

    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform 0.45s ease;
}

.flashcard.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    padding: 55px 25px 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    background: white;

    border: 1px solid #ddd;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.card-back {
    transform: rotateY(180deg);
}

.card-label {
    position: absolute;

    top: 16px;
    left: 17px;

    color: #888;

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
}

.card-main {
    width: 100%;

    font-size: clamp(26px, 7vw, 42px);

    line-height: 1.25;

    font-weight: 650;

    overflow-wrap: anywhere;
}

.card-hint {
    position: absolute;

    bottom: 15px;

    left: 15px;
    right: 15px;

    color: #aaa;

    font-size: 11px;
}


/* =========================
   SPEAKER
========================= */

.speak-btn {
    position: absolute;

    top: 10px;
    right: 10px;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 1px solid #ddd;

    background: white;

    font-size: 18px;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;
}

.speak-btn.speaking {
    background: #202124;
    color: white;
}


/* =========================
   NAVIGATION
========================= */

.navigation {
    width: 100%;

    display: grid;

    grid-template-columns: 52px 1fr 52px;

    gap: 10px;

    align-items: center;

    margin-top: 12px;
}

.nav-btn {
    width: 52px;
    height: 46px;

    border-radius: 11px;

    border: 1px solid #d5d8de;

    background: white;

    font-size: 24px;
}

.page-counter {
    text-align: center;

    font-size: 14px;
    font-weight: 650;
}


/* =========================
   ANSWERS
========================= */

.answer-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    width: 100%;

    margin-top: 10px;
}

.answer-btn {
    min-height: 48px;

    border-radius: 11px;

    border: 1px solid #d5d8de;

    background: white;

    font-size: 13px;
    font-weight: 650;
}

.answer-btn.unknown {
    color: #d93025;
}

.answer-btn.known {
    color: #188038;
}


/* =========================
   PROGRESS
========================= */

.progress-section {
    width: 100%;

    margin-top: 14px;
}

.progress-text {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    color: #777;

    font-size: 11px;
}

.progress {
    width: 100%;

    height: 6px;

    border-radius: 99px;

    background: #e1e3e7;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #202124;

    transition: width .25s ease;
}


/* =========================
   DETAILS
========================= */

details {
    width: 100%;

    margin-top: 12px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

summary {
    min-height: 46px;

    padding: 13px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    cursor: pointer;

    font-size: 13px;
    font-weight: 650;

    list-style: none;
}

summary::-webkit-details-marker {
    display: none;
}

summary::after {
    content: "+";

    font-size: 18px;

    color: #777;
}

details[open] summary::after {
    content: "−";
}

.details-content {
    padding: 13px;

    border-top: 1px solid #eee;
}


/* =========================
   ADD
========================= */

textarea {
    width: 100%;

    min-height: 120px;

    resize: vertical;

    border: 1px solid #d5d8de;

    border-radius: 10px;

    padding: 12px;

    font-size: 14px;

    line-height: 1.4;

    outline: none;
}

textarea:focus {
    border-color: #202124;
}

.description {
    color: #777;

    font-size: 11px;

    margin-bottom: 10px;

    line-height: 1.4;
}

.action {
    width: 100%;

    min-height: 44px;

    margin-top: 8px;

    border-radius: 10px;

    border: 1px solid #d5d8de;

    background: white;

    font-size: 13px;
    font-weight: 600;
}

.action.primary {
    background: #202124;
    color: white;

    border-color: #202124;
}


/* =========================
   LIST
========================= */

.list-item {
    display: grid;

    grid-template-columns: 1fr auto;

    gap: 5px;

    padding: 10px;

    border: 1px solid #eee;

    border-radius: 9px;

    margin-bottom: 7px;
}

.list-en {
    font-size: 13px;
    font-weight: 650;
}

.list-ru {
    font-size: 12px;
    color: #777;
}

.delete-btn {
    grid-column: 2;
    grid-row: 1 / span 2;

    border: none;

    background: transparent;

    color: #999;

    font-size: 22px;
}


/* =========================
   SMALL ANDROID
========================= */

@media (max-width: 390px) {

    .container {
        padding-left: 10px;
        padding-right: 10px;
    }

    h1 {
        font-size: 22px;
    }

    .counter {
        font-size: 11px;
        padding: 7px 8px;
    }

    .direction-btn {
        font-size: 11px;
        padding-left: 10px;
        padding-right: 10px;
    }

    .flashcard {
        height: 350px;
    }

    .card-main {
        font-size: 25px;
    }

}


/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) and (max-height: 600px) {

    .container {
        padding-top: 10px;
    }

    .flashcard {
        height: 260px;
    }

}
</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>English phrases</h1>

            <div class="subtitle">
                Карточки для изучения английского
            </div>
        </div>

        <div
            class="counter"
            id="totalCounter">
            0 terms
        </div>

    </div>


    <!-- DIRECTION -->

    <div class="top-controls">

        <button
            class="direction-btn active"
            id="enRuBtn"
            onclick="setDirection('en-ru')">

            🇬🇧 English → Русский

        </button>

        <button
            class="direction-btn"
            id="ruEnBtn"
            onclick="setDirection('ru-en')">

            🇷🇺 Русский → English

        </button>

        <button
            class="direction-btn"
            id="mixedBtn"
            onclick="setDirection('mixed')">

            🔀 Mixed

        </button>

    </div>


    <!-- EMPTY -->

    <div
        id="emptyState">

        <strong>
            У тебя пока нет карточек
        </strong>

        Добавь фразы ниже,
        чтобы начать обучение.

    </div>


    <!-- STUDY -->

    <div
        id="studyArea"
        style="display:none;">


        <!-- CARD -->

        <div class="card-wrapper">

            <div
                class="flashcard"
                id="flashcard"
                onclick="flipCard()">

                <div class="card-inner">


                    <!-- FRONT -->

                    <div class="card-face">

                        <div
                            class="card-label"
                            id="frontLabel">
                            English
                        </div>

                        <button
                            class="speak-btn"
                            onclick="speakEnglish(event)">
                            🔊
                        </button>

                        <div
                            class="card-main"
                            id="frontText">
                        </div>

                        <div class="card-hint">
                            Нажми на карточку
                        </div>

                    </div>


                    <!-- BACK -->

                    <div class="card-face card-back">

                        <div
                            class="card-label"
                            id="backLabel">
                            Русский
                        </div>

                        <button
                            class="speak-btn"
                            onclick="speakEnglish(event)">
                            🔊
                        </button>

                        <div
                            class="card-main"
                            id="backText">
                        </div>

                        <div class="card-hint">
                            Нажми на карточку
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- NAVIGATION -->

        <div class="navigation">

            <button
                class="nav-btn"
                onclick="previousCard()">
                ←
            </button>

            <div
                class="page-counter"
                id="pageCounter">
                1 / 1
            </div>

            <button
                class="nav-btn"
                onclick="nextCard()">
                →
            </button>

        </div>


        <!-- ANSWERS -->

        <div class="answer-buttons">

            <button
                class="answer-btn unknown"
                onclick="markUnknown()">

                ✕ Не знаю

            </button>

            <button
                class="answer-btn known"
                onclick="markKnown()">

                ✓ Знаю

            </button>

        </div>


        <!-- PROGRESS -->

        <div class="progress-section">

            <div class="progress-text">

                <span>Прогресс</span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>


        <!-- VOICE -->

        <details>

            <summary>
                🔊 Настройки озвучки
            </summary>

            <div class="details-content">

                <button
                    class="action"
                    onclick="setVoice('en-US')">
                    🇺🇸 English US
                </button>

                <button
                    class="action"
                    onclick="setVoice('en-GB')">
                    🇬🇧 English UK
                </button>

                <button
                    class="action"
                    onclick="setRate(0.75)">
                    Скорость 0.75×
                </button>

                <button
                    class="action"
                    onclick="setRate(0.9)">
                    Скорость 0.9×
                </button>

                <button
                    class="action"
                    onclick="setRate(1)">
                    Скорость 1×
                </button>

                <button
                    class="action"
                    onclick="setRate(1.25)">
                    Скорость 1.25×
                </button>

                <button
                    class="action"
                    onclick="shuffleCards()">
                    🔀 Перемешать
                </button>

                <button
                    class="action"
                    onclick="resetStats()">
                    ↺ Сбросить статистику
                </button>

            </div>

        </details>


        <!-- ADD CARDS -->

        <details>

            <summary>
                ＋ Добавить карточки
            </summary>

            <div class="details-content">

                <div class="description">

                    Одна карточка на строку:

                    <b>
                        English — Русский
                    </b>

                </div>

                <textarea
                    id="cardInput"
                    placeholder="How did you pull that off? — Как тебе это удалось?
I'm still mortified — Мне до сих пор ужасно неловко">
                </textarea>

                <button
                    class="action primary"
                    onclick="addCards()">

                    ＋ Добавить карточки

                </button>

                <button
                    class="action"
                    onclick="loadExample()">

                    Пример

                </button>

                <button
                    class="action"
                    onclick="clearAll()">

                    Очистить всё

                </button>

            </div>

        </details>


        <!-- ALL CARDS -->

        <details>

            <summary>
                📚 Все карточки
            </summary>

            <div
                class="details-content"
                id="cardList">
            </div>

        </details>


    </div>

</div>


<script>


/* =========================
   DATA
========================= */

let cards =
    JSON.parse(
        localStorage.getItem(
            "englishCards"
        ) || "[]"
    );

let currentIndex = 0;

let direction =
    localStorage.getItem(
        "cardDirection"
    ) || "en-ru";

let currentDirection =
    direction;

let speechRate =
    Number(
        localStorage.getItem(
            "speechRate"
        ) || "0.9"
    );

let voiceLanguage =
    localStorage.getItem(
        "voiceLanguage"
    ) || "en-US";


/* =========================
   ELEMENTS
========================= */

const flashcard =
    document.getElementById(
        "flashcard"
    );

const frontText =
    document.getElementById(
        "frontText"
    );

const backText =
    document.getElementById(
        "backText"
    );

const frontLabel =
    document.getElementById(
        "frontLabel"
    );

const backLabel =
    document.getElementById(
        "backLabel"
    );

const studyArea =
    document.getElementById(
        "studyArea"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const cardInput =
    document.getElementById(
        "cardInput"
    );

const pageCounter =
    document.getElementById(
        "pageCounter"
    );

const totalCounter =
    document.getElementById(
        "totalCounter"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressPercent =
    document.getElementById(
        "progressPercent"
    );

const cardList =
    document.getElementById(
        "cardList"
    );


/* =========================
   DIRECTION
========================= */

function setDirection(value) {

    direction = value;

    localStorage.setItem(
        "cardDirection",
        direction
    );

    updateButtons();

    updatePlaceholder();

    showCard();
}


function updateButtons() {

    document
        .getElementById("enRuBtn")
        .classList.toggle(
            "active",
            direction === "en-ru"
        );

    document
        .getElementById("ruEnBtn")
        .classList.toggle(
            "active",
            direction === "ru-en"
        );

    document
        .getElementById("mixedBtn")
        .classList.toggle(
            "active",
            direction === "mixed"
        );
}


/* =========================
   PLACEHOLDER
========================= */

function updatePlaceholder() {

    if (direction === "ru-en") {

        cardInput.placeholder =
            "Как тебе это удалось? — How did you pull that off?";

    } else {

        cardInput.placeholder =
            "How did you pull that off? — Как тебе это удалось?";

    }
}


/* =========================
   ADD CARDS
========================= */

function addCards() {

    const text =
        cardInput.value.trim();

    if (!text) {

        alert(
            "Введи хотя бы одну карточку."
        );

        return;
    }

    const lines =
        text.split("\n");

    let added = 0;

    lines.forEach(function(line) {

        line = line.trim();

        if (!line) return;

        let parts;

        if (line.includes("—")) {

            parts =
                line.split("—");

        } else if (line.includes("–")) {

            parts =
                line.split("–");

        } else {

            parts =
                line.split(/\s+-\s+/);

        }

        if (parts.length < 2) return;

        const english =
            parts[0].trim();

        const russian =
            parts
                .slice(1)
                .join("—")
                .trim();

        if (!english || !russian) {
            return;
        }

        const exists =
            cards.some(function(card) {

                return (
                    card.english
                        .toLowerCase() ===
                    english.toLowerCase()
                    &&
                    card.russian
                        .toLowerCase() ===
                    russian.toLowerCase()
                );

            });

        if (exists) return;

        cards.push({
            english: english,
            russian: russian
        });

        added++;

    });


    if (added === 0) {

        alert(
            "Не удалось добавить карточки.\n\n" +
            "Используй формат:\n" +
            "English — Русский"
        );

        return;
    }


    saveCards();

    cardInput.value = "";

    currentIndex =
        cards.length - added;

    showCard();

    renderList();
}


/* =========================
   SHOW CARD
========================= */

function showCard() {

    if (cards.length === 0) {

        studyArea.style.display =
            "none";

        emptyState.style.display =
            "block";

        totalCounter.textContent =
            "0 terms";

        return;
    }


    emptyState.style.display =
        "none";

    studyArea.style.display =
        "block";


    if (currentIndex >= cards.length) {
        currentIndex = 0;
    }

    if (currentIndex < 0) {
        currentIndex =
            cards.length - 1;
    }


    const card =
        cards[currentIndex];


    if (direction === "mixed") {

        currentDirection =
            Math.random() < 0.5
                ? "en-ru"
                : "ru-en";

    } else {

        currentDirection =
            direction;
    }


    flashcard.classList.remove(
        "flipped"
    );


    stopSpeaking();


    if (currentDirection === "en-ru") {

        frontLabel.textContent =
            "English";

        backLabel.textContent =
            "Русский";

        frontText.textContent =
            card.english;

        backText.textContent =
            card.russian;

    } else {

        frontLabel.textContent =
            "Русский";

        backLabel.textContent =
            "English";

        frontText.textContent =
            card.russian;

        backText.textContent =
            card.english;
    }


    pageCounter.textContent =
        (currentIndex + 1) +
        " / " +
        cards.length;


    totalCounter.textContent =
        cards.length +
        (
            cards.length === 1
                ? " term"
                : " terms"
        );


    updateProgress();
}


/* =========================
   FLIP
========================= */

function flipCard() {

    if (cards.length === 0) return;

    flashcard.classList.toggle(
        "flipped"
    );
}


/* =========================
   NAVIGATION
========================= */

function nextCard() {

    if (cards.length === 0) return;

    currentIndex++;

    if (currentIndex >= cards.length) {
        currentIndex = 0;
    }

    showCard();
}


function previousCard() {

    if (cards.length === 0) return;

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex =
            cards.length - 1;
    }

    showCard();
}


/* =========================
   ANSWERS
========================= */

function markKnown() {

    localStorage.setItem(
        "knownCards",
        Number(
            localStorage.getItem(
                "knownCards"
            ) || 0
        ) + 1
    );

    nextCard();
}


function markUnknown() {

    localStorage.setItem(
        "unknownCards",
        Number(
            localStorage.getItem(
                "unknownCards"
            ) || 0
        ) + 1
    );

    nextCard();
}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    if (cards.length === 0) {

        progressBar.style.width =
            "0%";

        progressPercent.textContent =
            "0%";

        return;
    }


    const percent =
        Math.round(
            (
                (currentIndex + 1) /
                cards.length
            ) * 100
        );


    progressBar.style.width =
        percent + "%";

    progressPercent.textContent =
        percent + "%";
}


/* =========================
   SHUFFLE
========================= */

function shuffleCards() {

    if (cards.length < 2) return;

    for (
        let i = cards.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            cards[i],
            cards[j]
        ] =
        [
            cards[j],
            cards[i]
        ];
    }

    saveCards();

    currentIndex = 0;

    showCard();

    renderList();
}


/* =========================
   RESET
========================= */

function resetStats() {

    localStorage.setItem(
        "knownCards",
        "0"
    );

    localStorage.setItem(
        "unknownCards",
        "0"
    );

    alert(
        "Статистика сброшена."
    );
}


/* =========================
   VOICE
========================= */

function setVoice(language) {

    voiceLanguage = language;

    localStorage.setItem(
        "voiceLanguage",
        language
    );
}


function setRate(rate) {

    speechRate =
        Number(rate);

    localStorage.setItem(
        "speechRate",
        speechRate
    );
}


/* =========================
   SPEAK
========================= */

function speakEnglish(event) {

    event.stopPropagation();

    if (cards.length === 0) return;

    const text =
        cards[currentIndex].english;

    if (!text) return;


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Озвучка не поддерживается этим браузером."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const voices =
        window.speechSynthesis
            .getVoices();


    const voice =
        voices.find(function(v) {

            return v.lang
                .toLowerCase()
                .startsWith(
                    voiceLanguage
                        .substring(0,2)
                        .toLowerCase()
                );

        });


    if (voice) {

        utterance.voice =
            voice;

        utterance.lang =
            voice.lang;

    } else {

        utterance.lang =
            voiceLanguage;
    }


    utterance.rate =
        speechRate;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================
   STOP
========================= */

function stopSpeaking() {

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();
    }
}


/* =========================
   EXAMPLE
========================= */

/* =========================
   SAVE
========================= */

function saveCards() {

    localStorage.setItem(
        "englishCards",
        JSON.stringify(cards)
    );
}


/* =========================
   DELETE
========================= */

function deleteCard(index) {

    cards.splice(
        index,
        1
    );


    if (
        currentIndex >= cards.length
    ) {

        currentIndex =
            Math.max(
                0,
                cards.length - 1
            );
    }


    saveCards();

    showCard();

    renderList();
}


/* =========================
   CLEAR
========================= */

function clearAll() {

    if (cards.length === 0) return;


    if (
        !confirm(
            "Удалить все карточки?"
        )
    ) {

        return;
    }


    cards = [];

    currentIndex = 0;


    localStorage.removeItem(
        "englishCards"
    );

    localStorage.removeItem(
        "knownCards"
    );

    localStorage.removeItem(
        "unknownCards"
    );


    stopSpeaking();

    showCard();

    renderList();
}


/* =========================
   LIST
========================= */

function renderList() {

    cardList.innerHTML = "";


    if (cards.length === 0) {

        cardList.innerHTML =
            '<div style="color:#777;font-size:13px;">Карточек пока нет.</div>';

        return;
    }


    cards.forEach(
        function(card, index) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "list-item";


            item.innerHTML =
                '<div class="list-en">' +
                escapeHtml(
                    card.english
                ) +
                '</div>' +

                '<div class="list-ru">' +
                escapeHtml(
                    card.russian
                ) +
                '</div>' +

                '<button class="delete-btn" ' +
                'onclick="deleteCard(' +
                index +
                ')">' +
                '×' +
                '</button>';


            cardList.appendChild(
                item
            );
        }
    );
}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.target.tagName ===
                "TEXTAREA" ||
            event.target.tagName ===
                "INPUT"
        ) {

            return;
        }


        if (event.code === "Space") {

            event.preventDefault();

            flipCard();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextCard();
        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousCard();
        }


        if (event.key === "1") {

            markUnknown();
        }


        if (event.key === "2") {

            markKnown();
        }

    }
);


/* =========================
   INIT
========================= */

updateButtons();

updatePlaceholder();

showCard();

renderList();

</script>
