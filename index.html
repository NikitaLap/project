<div class="container">

  <header class="header">
    <h1>English phrases</h1>
    <p>Карточки для изучения английского</p>
    <p id="totalCounter"></p>
  </header>

  <div class="direction-buttons">
    <button id="dirEnRu" onclick="setDirection('en-ru')">
      English → Русский
    </button>

    <button id="dirRuEn" onclick="setDirection('ru-en')">

    <button id="dirMixed" onclick="setDirection('mixed')">
      Mixed
    </button>
  </div>

  <!-- GROUPS -->

  <section id="groupsView" class="groups-view">

    <div class="groups-header">
      <h2>Мои группы</h2>

      <button
        class="create-group-btn"
        onclick="showCreateGroup()">
        ＋ Создать группу
      </button>
    </div>

    <div id="groupList" class="group-list"></div>

  </section>

  <!-- EMPTY -->

  <section id="emptyState" class="empty-state">
    <h2>Пока нет карточек</h2>
    <p>Создай группу и добавь первые карточки.</p>
  </section>

  <!-- ADD CARDS -->

  <section id="addCardsMobile" class="add-box">

    <h3>Добавить карточки</h3>

    <label>Группа:</label>

    <select id="firstGroupSelect" class="group-select"></select>

    <textarea
      id="cardInput"
      placeholder="Например:

How did you pull that off? — Как тебе удалось это сделать?
You can't be serious. — Ты не можешь быть серьёзным.
I'm still mortified. — Мне до сих пор ужасно неловко."
    ></textarea>

    <br><br>

    <button class="primary-btn" onclick="addCards()">
      Добавить карточки
    </button>

  </section>

  <!-- STUDY -->

  <section id="studyArea" class="study-area">

    <div class="study-top">
      <button class="back-btn" onclick="showGroups()">
        ← Все группы
      </button>

      <span id="currentGroupName" class="current-group-name"></span>
    </div>

    <div
      id="flashcard"
      class="flashcard"
      onclick="flipCard()"
    >

      <div id="cardLabel" class="card-label"></div>

      <div id="cardText" class="card-text"></div>

      <button
        class="speech-btn"
        onclick="speakCurrent(event)">

      </button>

      <button

      </span>

      </button>

      <div id="progress" class="progress"></div>

    <!-- VOICE -->

    <details>
      <summary>🔊 Настройки голоса</summary>

      <div class="settings-row">

        <label>Язык:</label>

        <select id="voiceLanguage">
          <option value="en-US">English US</option>
          <option value="en-GB">English UK</option>
        </select>

      </div>

      <div class="settings-row">

        <label>Скорость:</label>

        <input
          id="speechRate"
          type="range"
          min="0.5"
          max="1.5"
          step="0.1"
          value="1">

        <span id="speechRateValue">1</span>

      </div>
    </details>

    <!-- ADD FROM STUDY -->

    <details>
      <summary>➕ Добавить карточки</summary>

        <label>Добавить в:</label>

        <select
          id="studyGroupSelect"
          class="group-select">
        </select>

        <textarea
          id="cardInputStudy"
          placeholder="English — Русский"
        ></textarea>

          class="primary-btn"

        </button>

      <summary>📋 Карточки этой группы</summary>

        id="cardList"
        class="card-list">
      </div>

    </details>

    <button
      class="delete-btn"
      onclick="deleteCurrentGroupCards()">
      🗑️ Удалить карточки этой группы
    </button>

  </section>

</div>

<script>

/* =========================================================
   DATA
========================================================= */

let cards = JSON.parse(
  localStorage.getItem("englishCards") || "[]"
);

let knownCards = JSON.parse(
  localStorage.getItem("knownCards") || "[]"
);

let unknownCards = JSON.parse(
  localStorage.getItem("unknownCards") || "[]"
);

let groups = JSON.parse(
  localStorage.getItem("cardGroups") || "[]"
);

let currentGroupId =
  localStorage.getItem("currentGroupId") || null;

let direction =
  localStorage.getItem("cardDirection") || "en-ru";

let speechRate =
  Number(localStorage.getItem("speechRate") || "1");

let voiceLanguage =
  localStorage.getItem("voiceLanguage") || "en-US";

let currentIndex = 0;
let isFlipped = false;

let studyCards = [];


/* =========================================================
   ID
========================================================= */

function makeId() {
  return Date.now() + "_" +
    Math.random().toString(36).slice(2, 9);
}


/* =========================================================
   SAVE
========================================================= */

function saveAll() {

  localStorage.setItem(
    "englishCards",
    JSON.stringify(cards)
  );

  localStorage.setItem(
    "knownCards",
    JSON.stringify(knownCards)
  );

  localStorage.setItem(
    "unknownCards",
    JSON.stringify(unknownCards)
  );

  localStorage.setItem(
    "cardGroups",
    JSON.stringify(groups)
  );

  if (currentGroupId) {
    localStorage.setItem(
      "currentGroupId",
      currentGroupId
    );
  } else {
    localStorage.removeItem("currentGroupId");
  }

  updateCounters();
}


/* =========================================================
   OLD CARDS MIGRATION
========================================================= */

function migrateOldCards() {

  if (cards.length === 0) return;

  let changed = false;

  /*
    Если группы ещё никогда не существовали,
    создаём "Без группы" и переносим туда
    старые карточки.
  */

  if (groups.length === 0) {

    const defaultGroup = {
      id: makeId(),
      name: "Без группы"
    };

    groups.push(defaultGroup);

    cards.forEach(card => {

      if (!card.groupId) {

        card.groupId = defaultGroup.id;
        changed = true;

      }

    });

  } else {

    /*
      Если группы уже есть, но есть карточки
      без groupId — отправляем их в "Без группы".
    */

    let fallback = groups.find(
      group => group.name === "Без группы"
    );

    const hasOrphans = cards.some(
      card => !card.groupId
    );

    if (hasOrphans && !fallback) {

      fallback = {
        id: makeId(),
        name: "Без группы"
      };

      groups.push(fallback);

    }

    if (fallback) {

      cards.forEach(card => {

        if (!card.groupId) {

          card.groupId = fallback.id;
          changed = true;

        }

      });

    }

  }

  if (changed) {
    saveAll();
  }
}


/* =========================================================
   COUNTERS
========================================================= */

function updateCounters() {

  document.getElementById("totalCounter").textContent =
    `Всего карточек: ${cards.length}`;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================================================
   GROUPS
========================================================= */

function renderGroups() {

  const list =
    document.getElementById("groupList");

  list.innerHTML = "";


  /* ALL CARDS */

  const allItem =
    document.createElement("div");

  allItem.className = "group-item";

  allItem.innerHTML = `
    <div class="group-icon">📚</div>

    <div class="group-main">
      <div class="group-name">
        Все карточки
      </div>

      <div class="group-count">
        ${cards.length} карточек
      </div>
    </div>
  `;

  allItem.onclick = () => openGroup(null);

  list.appendChild(allItem);


  /* GROUPS */

  groups.forEach(group => {

    const count =
      cards.filter(
        card => card.groupId === group.id
      ).length;

    const item =
      document.createElement("div");

    item.className = "group-item";

    item.innerHTML = `
      <div class="group-icon">📁</div>

      <div class="group-main">
        <div class="group-name">
          ${escapeHtml(group.name)}
        </div>

        <div class="group-count">
          ${count} карточек
        </div>
      </div>

      <button
        class="group-menu"
        aria-label="Меню группы">
        ⋮
      </button>
    `;

    const menu =
      item.querySelector(".group-menu");

    menu.onclick = function(event) {

      event.stopPropagation();

      groupMenu(group.id);

    };

    item.onclick = () =>
      openGroup(group.id);

    list.appendChild(item);

  });

}


/* =========================================================
   SHOW GROUPS
========================================================= */

function showGroups() {

  document.getElementById(
    "groupsView"
  ).style.display = "block";

  document.getElementById(
    "studyArea"
  ).style.display = "none";

  document.getElementById(
    "emptyState"
  ).style.display =
    cards.length === 0 ? "block" : "none";

  document.getElementById(
    "addCardsMobile"
  ).style.display =
    groups.length === 0 ? "block" : "none";

  renderGroups();
  updateGroupSelects();

}


/* =========================================================
   CREATE GROUP
========================================================= */

function showCreateGroup() {

  const name = prompt(
    "Введите название новой группы:"
  );

  if (name === null) return;

  const cleanName = name.trim();

  if (!cleanName) {

    alert(
      "Название группы не может быть пустым."
    );

    return;
  }

  const exists = groups.some(
    group =>
      group.name.toLowerCase() ===
      cleanName.toLowerCase()
  );

  if (exists) {

    alert(
      "Такая группа уже существует."
    );

    return;
  }

  const newGroup = {
    id: makeId(),
    name: cleanName
  };

  groups.push(newGroup);

  currentGroupId = newGroup.id;

  saveAll();

  renderGroups();

  updateGroupSelects();

  document.getElementById(
    "firstGroupSelect"
  ).value = newGroup.id;

  /*
    После создания сразу показываем
    добавление карточек.
  */

  document.getElementById(
    "groupsView"
  ).style.display = "block";

  document.getElementById(
    "emptyState"
  ).style.display = "none";

  document.getElementById(
    "addCardsMobile"
  ).style.display = "block";

  document.getElementById(
    "cardInput"
  ).focus();

}


/* =========================================================
   GROUP MENU
========================================================= */

function groupMenu(groupId) {

  const group =
    groups.find(
      item => item.id === groupId
    );

  if (!group) return;

  const action =
    prompt(
      `Группа: ${group.name}\n\n` +
      `1 — Переименовать\n` +
      `2 — Удалить\n\n` +
      `Введите 1 или 2:`
    );

  if (action === "1") {

    renameGroup(groupId);

  }

  if (action === "2") {

    deleteGroup(groupId);

  }

}


/* =========================================================
   RENAME GROUP
========================================================= */

function renameGroup(groupId) {

  const group =
    groups.find(
      item => item.id === groupId
    );

  if (!group) return;

  const newName =
    prompt(
      "Новое название группы:",
      group.name
    );

  if (newName === null) return;

  const cleanName = newName.trim();

  if (!cleanName) {

    alert(
      "Название не может быть пустым."
    );

    return;
  }

  const duplicate =
    groups.some(
      item =>
        item.id !== groupId &&
        item.name.toLowerCase() ===
        cleanName.toLowerCase()
    );

  if (duplicate) {

    alert(
      "Такая группа уже существует."
    );

    return;
  }

  group.name = cleanName;

  saveAll();

  renderGroups();

  updateGroupSelects();

  updateGroupName();

}


/* =========================================================
   DELETE GROUP
========================================================= */

function deleteGroup(groupId) {

  const group =
    groups.find(
      item => item.id === groupId
    );

  if (!group) return;

  const groupCards =
    cards.filter(
      card => card.groupId === groupId
    );

  const confirmed =
    confirm(
      `Удалить группу "${group.name}"?\n\n` +
      `Карточек внутри: ${groupCards.length}\n\n` +
      `Все карточки этой группы тоже будут удалены.\n\n` +
      `Это действие нельзя отменить.`
    );

  if (!confirmed) return;

  const deletedIds =
    new Set(
      groupCards.map(card => card.id)
    );

  cards =
    cards.filter(
      card => card.groupId !== groupId
    );

  knownCards =
    knownCards.filter(
      id => !deletedIds.has(id)
    );

  unknownCards =
    unknownCards.filter(
      id => !deletedIds.has(id)
    );

  groups =
    groups.filter(
      item => item.id !== groupId
    );

  currentGroupId = null;
  currentIndex = 0;
  isFlipped = false;

  saveAll();

  showGroups();

}


/* =========================================================
   OPEN GROUP
========================================================= */

function openGroup(
  groupId,
  autoShow = true
) {

  currentGroupId = groupId;

  currentIndex = 0;

  isFlipped = false;


  if (groupId === null) {

    studyCards = cards.slice();

  } else {

    studyCards =
      cards.filter(
        card => card.groupId === groupId
      );

  }


  /*
    Пустая группа.
  */

  if (studyCards.length === 0) {

    if (autoShow) {

      document.getElementById(
        "groupsView"
      ).style.display = "block";

      document.getElementById(
        "studyArea"
      ).style.display = "none";

      document.getElementById(
        "emptyState"
      ).style.display = "none";

      document.getElementById(
        "addCardsMobile"
      ).style.display = "block";

      updateGroupSelects();

      document.getElementById(
        "firstGroupSelect"
      ).value = groupId || "";

    }

    return;
  }


  localStorage.setItem(
    "currentGroupId",
    groupId || ""
  );


  document.getElementById(
    "groupsView"
  ).style.display = "none";

  document.getElementById(
    "emptyState"
  ).style.display = "none";

  document.getElementById(
    "addCardsMobile"
  ).style.display = "none";

  document.getElementById(
    "studyArea"
  ).style.display = "block";


  updateGroupName();

  updateGroupSelects();

  showCard();

  renderList();

  updateCounters();

}


/* =========================================================
   GROUP NAME
========================================================= */

function updateGroupName() {

  const el =
    document.getElementById(
      "currentGroupName"
    );

  if (currentGroupId === null) {

    el.textContent =
      "Все карточки";

    return;
  }

  const group =
    groups.find(
      item => item.id === currentGroupId
    );

  el.textContent =
    group ? group.name : "Все карточки";

}


/* =========================================================
   SELECTS
========================================================= */

function updateGroupSelects() {

  const first =
    document.getElementById(
      "firstGroupSelect"
    );

  const study =
    document.getElementById(
      "studyGroupSelect"
    );

  if (!first || !study) return;


  first.innerHTML = "";

  groups.forEach(group => {

    const option =
      document.createElement("option");

    option.value = group.id;

    option.textContent = group.name;

    first.appendChild(option);

  });


  study.innerHTML = "";

  const allOption =
    document.createElement("option");

  allOption.value = "";

  allOption.textContent =
    "Все карточки";

  study.appendChild(allOption);


  groups.forEach(group => {

    const option =
      document.createElement("option");

    option.value = group.id;

    option.textContent = group.name;

    study.appendChild(option);

  });


  if (
    currentGroupId &&
    groups.some(
      group => group.id === currentGroupId
    )
  ) {

    first.value = currentGroupId;

    study.value = currentGroupId;

  } else {

    if (groups.length > 0) {

      first.value = groups[0].id;

    }

    study.value = "";

  }

}


/* =========================================================
   PARSE CARDS
========================================================= */

function parseCards(
  text,
  groupId
) {

  const lines =
    text
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean);

  let added = 0;

  lines.forEach(line => {

    /*
      Поддерживаем:
      English — Русский
      English – Русский
      English - Русский
    */

    const parts =
      line.split(
        /\s*[—–-]\s*/
      );

    if (parts.length < 2) return;

    const english =
      parts[0].trim();

    const russian =
      parts
        .slice(1)
        .join(" - ")
        .trim();

    if (!english || !russian) return;

    cards.push({
      id: makeId(),
      en: english,
      ru: russian,
      groupId: groupId
    });

    added++;

  });

  return added;

}


/* =========================================================
   ADD CARDS
========================================================= */

function addCards() {

  const input =
    document.getElementById(
      "cardInput"
    );

  const text =
    input.value.trim();

  if (!text) {

    alert(
      "Введи хотя бы одну карточку."
    );

    return;
  }


  const groupId =
    document.getElementById(
      "firstGroupSelect"
    ).value;


  if (!groupId) {

    alert(
      "Сначала создай группу."
    );

    return;
  }


  const oldLength =
    cards.length;


  const added =
    parseCards(
      text,
      groupId
    );


  if (added === 0) {

    alert(
      "Не удалось добавить карточки.\n\n" +
      "Формат:\n" +
      "English — Русский"
    );

    return;
  }


  input.value = "";

  saveAll();


  /*
    Открываем группу.
  */

  openGroup(groupId);


  /*
    Переходим на первую добавленную карточку.
  */

  const newCards =
    cards.slice(oldLength);

  const firstNewId =
    newCards.length
      ? newCards[0].id
      : null;

  const index =
    studyCards.findIndex(
      card => card.id === firstNewId
    );

  if (index >= 0) {

    currentIndex = index;

    showCard();

  }

}


/* =========================================================
   ADD CARDS FROM STUDY
========================================================= */

function addCardsFromStudy() {

  const input =
    document.getElementById(
      "cardInputStudy"
    );

  const text =
    input.value.trim();

  if (!text) {

    alert(
      "Введи хотя бы одну карточку."
    );

    return;
  }


  const selectedGroup =
    document.getElementById(
      "studyGroupSelect"
    ).value;


  let groupId =
    selectedGroup;


  if (!groupId) {

    if (currentGroupId) {

      groupId = currentGroupId;

    } else {

      alert(
        "Выбери группу для новых карточек."
      );

      return;
    }

  }


  const added =
    parseCards(
      text,
      groupId
    );


  if (added === 0) {

    alert(
      "Не удалось добавить карточки.\n\n" +
      "Формат:\n" +
      "English — Русский"
    );

    return;
  }


  input.value = "";

  saveAll();


  if (currentGroupId === groupId) {

    studyCards =
      cards.filter(
        card =>
          card.groupId === currentGroupId
      );

    currentIndex =
      Math.max(
        0,
        studyCards.length - added
      );

    showCard();

    renderList();

  }


  const details =
    input.closest("details");

  if (details) {

    details.open = false;

  }

}


/* =========================================================
   DIRECTION
========================================================= */

function setDirection(value) {

  direction = value;

  localStorage.setItem(
    "cardDirection",
    value
  );

  updateDirectionButtons();

  isFlipped = false;

  showCard();

}


function updateDirectionButtons() {

  document
    .getElementById("dirEnRu")
    .classList.toggle(
      "active",
      direction === "en-ru"
    );

  document
    .getElementById("dirRuEn")
    .classList.toggle(
      "active",
      direction === "ru-en"
    );

  document
    .getElementById("dirMixed")
    .classList.toggle(
      "active",
      direction === "mixed"
    );

}


/* =========================================================
   CARD DISPLAY
========================================================= */

function getCurrentCard() {

  return studyCards[currentIndex];

}


function getFrontBack(card) {

  if (direction === "en-ru") {

    return {
      front: card.en,
      back: card.ru
    };

  }

  if (direction === "ru-en") {

    return {
      front: card.ru,
      back: card.en
    };

  }

  /*
    Mixed
  */

  if (Math.random() > 0.5) {

    return {
      front: card.en,
      back: card.ru
    };

  }

  return {
    front: card.ru,
    back: card.en
  };

}


/* =========================================================
   SHOW CARD
========================================================= */

let currentFront = "";
let currentBack = "";


function showCard() {

  if (
    !studyCards.length
  ) {
    return;
  }


  const card =
    getCurrentCard();

  if (!card) return;


  /*
    Для Mixed сохраняем сторону,
    чтобы карточка не менялась
    при каждом обновлении.
  */

  if (!currentFront || isFlipped) {

    const sides =
      getFrontBack(card);

    currentFront =
      sides.front;

    currentBack =
      sides.back;

  }


  const text =
    isFlipped
      ? currentBack
      : currentFront;


  const label =
    isFlipped
      ? "Ответ"
      : "Вопрос";


  document.getElementById(
    "cardText"
  ).textContent = text;


  document.getElementById(
    "cardLabel"
  ).textContent = label;


  document.getElementById(
    "pageCounter"
  ).textContent =
    `${currentIndex + 1} / ${studyCards.length}`;


  const percent =
    ((currentIndex + 1) /
      studyCards.length) * 100;


  document.getElementById(
    "progress"
  ).style.width =
    percent + "%";

}


/* =========================================================
   FLIP
========================================================= */

function flipCard() {

  if (!studyCards.length) return;

  isFlipped = !isFlipped;

  showCard();

}


/* =========================================================
   NEXT
========================================================= */

function nextCard(event) {

  if (event) {
    event.stopPropagation();
  }

  if (!studyCards.length) return;

  currentIndex =
    (currentIndex + 1) %
    studyCards.length;

  isFlipped = false;

  currentFront = "";
  currentBack = "";

  showCard();

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousCard(event) {

  if (event) {
    event.stopPropagation();
  }

  if (!studyCards.length) return;

  currentIndex =
    (currentIndex - 1 +
      studyCards.length) %
    studyCards.length;

  isFlipped = false;

  currentFront = "";
  currentBack = "";

  showCard();

}


/* =========================================================
   KNOW / UNKNOWN
========================================================= */

function markKnown(event) {

  if (event) {
    event.stopPropagation();
  }

  const card =
    getCurrentCard();

  if (!card) return;


  knownCards =
    knownCards.filter(
      id => id !== card.id
    );

  unknownCards =
    unknownCards.filter(
      id => id !== card.id
    );

  knownCards.push(card.id);

  saveAll();

  nextCard();

}


function markUnknown(event) {

  if (event) {
    event.stopPropagation();
  }

  const card =
    getCurrentCard();

  if (!card) return;


  knownCards =
    knownCards.filter(
      id => id !== card.id
    );

  unknownCards =
    unknownCards.filter(
      id => id !== card.id
    );

  unknownCards.push(card.id);

  saveAll();

  nextCard();

}


/* =========================================================
   SPEECH
========================================================= */

function speakCurrent(event) {

  if (event) {
    event.stopPropagation();
  }

  const card =
    getCurrentCard();

  if (!card) return;


  /*
    Всегда произносим английскую
    версию.
  */

  const utterance =
    new SpeechSynthesisUtterance(
      card.en
    );

  utterance.lang =
    voiceLanguage;

  utterance.rate =
    speechRate;

  speechSynthesis.cancel();

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   CARD LIST
========================================================= */

function renderList() {

  const list =
    document.getElementById(
      "cardList"
    );

  list.innerHTML = "";


  studyCards.forEach(card => {

    const item =
      document.createElement("div");

    item.className =
      "card-list-item";

    item.innerHTML = `
      <div class="card-en">
        ${escapeHtml(card.en)}
      </div>

      <div class="card-ru">
        ${escapeHtml(card.ru)}
      </div>
    `;

    list.appendChild(item);

  });

}


/* =========================================================
   DELETE CURRENT GROUP CARDS
========================================================= */

function deleteCurrentGroupCards() {

  let groupName =
    "Все карточки";

  let idsToDelete;


  if (currentGroupId === null) {

    idsToDelete =
      new Set(
        cards.map(card => card.id)
      );

  } else {

    const group =
      groups.find(
        item =>
          item.id === currentGroupId
      );

    groupName =
      group
        ? group.name
        : "Группа";


    idsToDelete =
      new Set(
        cards
          .filter(
            card =>
              card.groupId ===
              currentGroupId
          )
          .map(card => card.id)
      );

  }


  if (idsToDelete.size === 0) {

    alert(
      "В этой группе нет карточек."
    );

    return;
  }


  const confirmed =
    confirm(
      `Удалить ${idsToDelete.size} карточек из "${groupName}"?\n\n` +
      `Это действие нельзя отменить.`
    );

  if (!confirmed) return;


  cards =
    cards.filter(
      card =>
        !idsToDelete.has(card.id)
    );

  knownCards =
    knownCards.filter(
      id =>
        !idsToDelete.has(id)
    );

  unknownCards =
    unknownCards.filter(
      id =>
        !idsToDelete.has(id)
    );


  saveAll();

  showGroups();

}

/* =========================================================

========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      document.activeElement.tagName ===

    ) {
      return;
    }

    if (
      document.activeElement.tagName ===

    ) {
      return;

    if (event.key === "ArrowRight") {

      nextCard();

    }


    if (event.key === "ArrowLeft") {

      previousCard();

    }


    if (event.key === " ") {

      event.preventDefault();

      flipCard();

    }

  }
);


/* =========================================================
   MOBILE SWIPE
========================================================= */

let touchStartX = 0;
let touchEndX = 0;


const flashcard =
  document.getElementById(
    "flashcard"
  );


flashcard.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  }
);


flashcard.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;

    const difference =
      touchEndX - touchStartX;


    if (Math.abs(difference) < 50) {
      return;
    }


    if (difference < 0) {

      nextCard();

    } else {

      previousCard();

    }

  }
);

} else {

}
