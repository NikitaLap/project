<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Cards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.07);
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    padding: 15px;
    border: 1px solid #d8dce5;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
}

textarea::placeholder {
    color: #aaa;
}

button {
    border: none;
    border-radius: 9px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    background: #e9edf5;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    background: #dfe4ee;
}

.primary {
    background: #4f7cff;
    color: white;
}

.primary:hover {
    background: #3f6de8;
}

.danger {
    background: #ffe5e5;
    color: #c62828;
}

.direction-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.direction-buttons button.active {
    background: #4f7cff;
    color: white;
}

.card-area {
    display: flex;
    justify-content: center;
    margin: 25px 0;
}

.flashcard {
    width: min(700px, 100%);
    height: 330px;
    perspective: 1200px;
    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform .55s;
    transform-style: preserve-3d;
}

.flashcard.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-side {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
}

.card-back {
    transform: rotateY(180deg);
}

.card-label {
    position: absolute;
    top: 20px;
    font-size: 13px;
    color: #999;
    text-transform: uppercase;
}

.card-text {
    font-size: clamp(25px, 4vw, 40px);
    font-weight: 600;
    line-height: 1.3;
}

.navigation {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
}

.answer-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}

.know {
    background: #dff7e5;
    color: #18733b;
}

.dont-know {
    background: #ffe2e2;
    color: #b42323;
}

.progress {
    height: 8px;
    background: #e4e7ed;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #4f7cff;
    transition: .3s;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 15px;
    color: #666;
}

.card-list {
    margin-top: 20px;
}

.card-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.card-item:last-child {
    border-bottom: none;
}

.card-item-text {
    overflow: hidden;
}

.card-item-text strong {
    display: block;
}

.card-item-text span {
    color: #777;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .flashcard {
        height: 280px;
    }

    .stats {
        gap: 15px;
        font-size: 14px;
    }

    .card-item {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🇬🇧 English Cards</h1>

    <div class="panel">

        <textarea
            id="cardInput"
            placeholder="How did you pull that off? — Как тебе это удалось?"
        ></textarea>

        <br><br>

        <button class="primary" onclick="addCards()">
            ➕ Добавить карточки
        </button>

        <button onclick="loadExample()">
            Пример
        </button>

        <button class="danger" onclick="clearAll()">
            🗑 Очистить всё
        </button>

    </div>

    <div class="direction-buttons">

        <button
            id="enRuBtn"
            onclick="setDirection('en-ru')"
        >
            🇬🇧 English → Русский
        </button>

        <button
            id="ruEnBtn"
            onclick="setDirection('ru-en')"
        >
            🇷🇺 Русский → English
        </button>

        <button
            id="mixedBtn"
            onclick="setDirection('mixed')"
        >
            🔀 Смешанный
        </button>

    </div>

    <div class="panel">

        <div class="card-area">

            <div
                class="flashcard"
                id="flashcard"
                onclick="flipCard()"
            >

                <div class="card-inner">

                    <div class="card-side">

                        <div
                            class="card-label"
                            id="frontLabel"
                        >
                            English
                        </div>

                        <div
                            class="card-text"
                            id="frontText"
                        >
                            Добавь карточки
                        </div>

                    </div>

                    <div class="card-side card-back">

                        <div
                            class="card-label"
                            id="backLabel"
                        >
                            Русский
                        </div>

                        <div
                            class="card-text"
                            id="backText"
                        >
                            —
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="navigation">

            <button onclick="previousCard()">
                ← Назад
            </button>

            <button onclick="nextCard()">
                Вперёд →
            </button>

            <button onclick="shuffleCards()">
                🔀 Перемешать
            </button>

        </div>

        <div class="answer-buttons">

            <button
                class="dont-know"
                onclick="answer(false)"
            >
                ❌ Не знаю
            </button>

            <button
                class="know"
                onclick="answer(true)"
            >
                ✅ Знаю
            </button>

        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

        <div class="stats">

            <span>
                📚 Карточек:
                <b id="totalCount">0</b>
            </span>

            <span>
                ✅ Знаю:
                <b id="knownCount">0</b>
            </span>

            <span>
                ❌ Не знаю:
                <b id="unknownCount">0</b>
            </span>

        </div>

    </div>

    <div class="panel card-list">

        <h3>Список карточек</h3>

        <div id="cardList"></div>

    </div>

</div>

<script>

let cards = JSON.parse(
    localStorage.getItem("englishCards") || "[]"
);

let currentIndex = 0;

let known = Number(
    localStorage.getItem("knownCards") || 0
);

let unknown = Number(
    localStorage.getItem("unknownCards") || 0
);

let direction =
    localStorage.getItem("cardDirection") || "en-ru";

let currentDirection = direction;


/* =========================
   ПРИМЕРЫ
========================= */

const examples = {

    "en-ru":
        "How did you pull that off? — Как тебе это удалось?",

    "ru-en":
        "Как тебе это удалось? — How did you pull that off?"

};


/* =========================
   ОБНОВИТЬ ПОДСКАЗКУ
========================= */

function updatePlaceholder() {

    const input =
        document.getElementById("cardInput");

    if (direction === "ru-en") {

        input.placeholder =
            examples["ru-en"];

    }
    else {

        input.placeholder =
            examples["en-ru"];

    }

}


/* =========================
   СОХРАНЕНИЕ
========================= */

function saveCards() {

    localStorage.setItem(
        "englishCards",
        JSON.stringify(cards)
    );

}


/* =========================
   ДОБАВЛЕНИЕ КАРТОЧЕК
========================= */

function addCards() {

    const input =
        document.getElementById("cardInput");

    const lines =
        input.value
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean);

    let added = 0;

    lines.forEach(line => {

        let parts;

        if (line.includes("—")) {

            parts = line.split("—");

        }
        else if (line.includes("–")) {

            parts = line.split("–");

        }
        else {

            parts =
                line.split(/\s+-\s+/);

        }

        if (parts.length < 2) return;

        const english =
            parts[0].trim();

        const russian =
            parts.slice(1)
                .join("—")
                .trim();

        if (!english || !russian) return;

        const exists =
            cards.some(card =>
                card.english.toLowerCase() ===
                    english.toLowerCase()
                &&
                card.russian.toLowerCase() ===
                    russian.toLowerCase()
            );

        if (!exists) {

            cards.push({
                english,
                russian
            });

            added++;

        }

    });

    saveCards();

    input.value = "";

    currentIndex =
        Math.max(
            0,
            cards.length - added
        );

    showCard();

}


/* =========================
   КНОПКА ПРИМЕР
========================= */

function loadExample() {

    const input =
        document.getElementById("cardInput");

    if (direction === "ru-en") {

        input.value =
            examples["ru-en"];

    }
    else {

        input.value =
            examples["en-ru"];

    }

}


/* =========================
   НАПРАВЛЕНИЕ
========================= */

function setDirection(newDirection) {

    direction = newDirection;

    localStorage.setItem(
        "cardDirection",
        direction
    );

    if (direction === "mixed") {

        currentDirection =
            Math.random() < 0.5
                ? "en-ru"
                : "ru-en";

    }
    else {

        currentDirection =
            direction;

    }

    updateDirectionButtons();

    updatePlaceholder();

    showCard();

}


/* =========================
   КНОПКИ НАПРАВЛЕНИЯ
========================= */

function updateDirectionButtons() {

    document
        .getElementById("enRuBtn")
        .classList.toggle(
            "active",
            direction === "en-ru"
        );

    document
        .getElementById("ruEnBtn")
        .classList.toggle(
            "active",
            direction === "ru-en"
        );

    document
        .getElementById("mixedBtn")
        .classList.toggle(
            "active",
            direction === "mixed"
        );

}


/* =========================
   ПОКАЗ КАРТОЧКИ
========================= */

function showCard() {

    const flashcard =
        document.getElementById("flashcard");

    flashcard.classList.remove(
        "flipped"
    );

    if (cards.length === 0) {

        document.getElementById(
            "frontText"
        ).textContent =
            "Добавь карточки";

        document.getElementById(
            "backText"
        ).textContent = "—";

        document.getElementById(
            "frontLabel"
        ).textContent = "";

        document.getElementById(
            "backLabel"
        ).textContent = "";

        updateStats();

        renderList();

        return;

    }

    if (currentIndex >= cards.length) {

        currentIndex =
            cards.length - 1;

    }

    if (currentIndex < 0) {

        currentIndex = 0;

    }

    const card =
        cards[currentIndex];

    if (direction === "mixed") {

        currentDirection =
            Math.random() < 0.5
                ? "en-ru"
                : "ru-en";

    }
    else {

        currentDirection =
            direction;

    }


    if (currentDirection === "en-ru") {

        document.getElementById(
            "frontLabel"
        ).textContent = "English";

        document.getElementById(
            "backLabel"
        ).textContent = "Русский";

        document.getElementById(
            "frontText"
        ).textContent =
            card.english;

        document.getElementById(
            "backText"
        ).textContent =
            card.russian;

    }
    else {

        document.getElementById(
            "frontLabel"
        ).textContent = "Русский";

        document.getElementById(
            "backLabel"
        ).textContent = "English";

        document.getElementById(
            "frontText"
        ).textContent =
            card.russian;

        document.getElementById(
            "backText"
        ).textContent =
            card.english;

    }

    updateStats();

}


/* =========================
   ПЕРЕВОРОТ
========================= */

function flipCard() {

    if (cards.length === 0) return;

    document
        .getElementById("flashcard")
        .classList.toggle(
            "flipped"
        );

}


/* =========================
   НАВИГАЦИЯ
========================= */

function nextCard() {

    if (cards.length === 0) return;

    currentIndex++;

    if (currentIndex >= cards.length) {

        currentIndex = 0;

    }

    showCard();

}


function previousCard() {

    if (cards.length === 0) return;

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex =
            cards.length - 1;

    }

    showCard();

}


/* =========================
   ОТВЕТ
========================= */

function answer(isKnown) {

    if (cards.length === 0) return;

    if (isKnown) {

        known++;

    }
    else {

        unknown++;

    }

    localStorage.setItem(
        "knownCards",
        known
    );

    localStorage.setItem(
        "unknownCards",
        unknown
    );

    nextCard();

}


/* =========================
   ПЕРЕМЕШИВАНИЕ
========================= */

function shuffleCards() {

    for (
        let i = cards.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            cards[i],
            cards[j]
        ] = [
            cards[j],
            cards[i]
        ];

    }

    currentIndex = 0;

    saveCards();

    showCard();

}


/* =========================
   СТАТИСТИКА
========================= */

function updateStats() {

    document.getElementById(
        "totalCount"
    ).textContent =
        cards.length;

    document.getElementById(
        "knownCount"
    ).textContent =
        known;

    document.getElementById(
        "unknownCount"
    ).textContent =
        unknown;

    const progress =
        cards.length
            ? ((currentIndex + 1) /
                cards.length) * 100
            : 0;

    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";

}


/* =========================
   СПИСОК КАРТОЧЕК
========================= */

function renderList() {

    const list =
        document.getElementById(
            "cardList"
        );

    if (cards.length === 0) {

        list.innerHTML =
            '<div class="empty">Карточек пока нет</div>';

        return;

    }

    list.innerHTML = "";

    cards.forEach(
        (card, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "card-item";

            item.innerHTML = `

                <div class="card-item-text">

                    <strong>
                        ${escapeHtml(
                            card.english
                        )}
                    </strong>

                    <span>
                        ${escapeHtml(
                            card.russian
                        )}
                    </span>

                </div>

                <button
                    class="danger"
                    onclick="deleteCard(${index})"
                >
                    🗑
                </button>

            `;

            list.appendChild(item);

        }
    );

}


/* =========================
   УДАЛЕНИЕ
========================= */

function deleteCard(index) {

    cards.splice(index, 1);

    if (
        currentIndex >= cards.length
    ) {

        currentIndex =
            Math.max(
                0,
                cards.length - 1
            );

    }

    saveCards();

    showCard();

}


/* =========================
   ОЧИСТКА
========================= */

function clearAll() {

    if (!cards.length) return;

    if (
        !confirm(
            "Удалить все карточки?"
        )
    ) {

        return;

    }

    cards = [];

    currentIndex = 0;

    known = 0;

    unknown = 0;

    localStorage.removeItem(
        "englishCards"
    );

    localStorage.removeItem(
        "knownCards"
    );

    localStorage.removeItem(
        "unknownCards"
    );

    showCard();

}


/* =========================
   ЗАЩИТА HTML
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   КЛАВИАТУРА
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.target.tagName ===
                "TEXTAREA"
            ||
            event.target.tagName ===
                "INPUT"
        ) {

            return;

        }

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            flipCard();

        }

        if (
            event.key === "ArrowRight"
        ) {

            nextCard();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousCard();

        }

        if (event.key === "1") {

            answer(true);

        }

        if (event.key === "2") {

            answer(false);

        }

    }
);


/* =========================
   ЗАПУСК
========================= */

updateDirectionButtons();

updatePlaceholder();

showCard();

renderList();

</script>

</body>
</html>
